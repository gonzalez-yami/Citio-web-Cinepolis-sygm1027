<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Cinépolis</title>
  <style>
    /* Estilos globales y suaves para navegación por anclajes */
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; font-family: Arial, sans-serif; background: #0b111e; color: #fff; 
      display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 30px 0; box-sizing: border-box;
    } 

    /* Contenedor principal estilo tarjeta */
    .card-club { 
      background: #121a2d; padding: 30px; border-radius: 12px; width: 360px; 
      text-align: center; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    } 
    .card-club h2 { margin: 0 0 20px; } 

    /* Barra superior fija con los enlaces de navegación rápida */
    .nav-anchors {
      display: flex; gap: 5px; margin-bottom: 25px; border-bottom: 1px solid #334155; 
      padding: 10px 0 15px; position: sticky; top: 0; background: #121a2d; z-index: 10;
    }
    .btn-anchor {
      background: #1e293b; color: #9ca3af; font: bold 10px sans-serif; padding: 8px 4px; 
      border-radius: 4px; text-decoration: none; flex: 1; text-transform: uppercase; 
      border: 1px solid #334155; transition: 0.3s; display: flex; align-items: center; justify-content: center;
    }
    .btn-anchor:hover { color: #fff; background: #2563eb; border-color: #2563eb; }

    /* Estilos compartidos de las secciones y formularios */
    .section-block {
      background: #080d19; padding: 20px; border-radius: 8px; border: 1px solid #1e293b; 
      margin-bottom: 25px; text-align: left;
    }
    .section-block h3 {
      margin: 0 0 15px; color: #38bdf8; font-size: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 8px;
    }
    .card-club label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
    .card-club input { 
      width: 100%; padding: 10px; margin-bottom: 15px; background: #121a2d; 
      border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box;
    } 

    /* Botones de acción principal */
    .btn-submit { 
      background: #2563eb; color: #fff; border: none; padding: 12px 20px; 
      border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 5px;
    } 
    .btn-submit:hover { background: #1d4ed8; }

    /* Botón/Enlace para regresar */
    .btn-volver { display: inline-block; margin-top: 10px; color: #9ca3af; text-decoration: none; font-size: 13px; } 
    .btn-volver:hover { color: #fff; } 
  </style>
</head>
<body>

  <div class="card-club">
    <h2>Club Cinépolis</h2>

    <!-- Menú con anclajes superiores para desplazarse por la página -->
    <div class="nav-anchors">
      <a href="#login" class="btn-anchor">Iniciar Sesión</a>
      <a href="#registro" class="btn-anchor">Registrarte</a>
      <a href="#tarjeta" class="btn-anchor">Tarjeta Club</a>
    </div>

    <!-- Sección 1: Formulario de Inicio de Sesión -->
    <div id="login" class="section-block">
      <h3>Iniciar Sesión</h3>
      <form>
        <label>Correo o Teléfono</label>
        <input type="text" placeholder="correo@ejemplo.com o 5512345678">

        <label>Contraseña</label>
        <input type="password" placeholder="••••••••">

        <button type="button" class="btn-submit">Entrar</button>
      </form>
    </div>

    <!-- Sección 2: Formulario de Registro de Usuario -->
    <div id="registro" class="section-block">
      <h3>Registrarte</h3>
      <form>
        <label>Correo Electrónico</label>
        <input type="email" placeholder="correo@ejemplo.com">

        <label>Contraseña</label>
        <input type="password" placeholder="••••••••">

        <label>Ciudad</label>
        <input type="text" placeholder="Ej. Ciudad de México">

        <label>Código Postal</label>
        <input type="text" placeholder="00000">

        <label>Nombre Completo</label>
        <input type="text" placeholder="Tu nombre y apellidos">

        <label>Fecha de Nacimiento</label>
        <input type="date">

        <button type="button" class="btn-submit">Registrarse</button>
      </form>
    </div>

    <!-- Sección 3: Vinculación de Tarjeta Cinépolis Club -->
    <div id="tarjeta" class="section-block">
      <h3>Tarjeta Cinépolis Club</h3>
      <form>
        <label>Correo Electrónico</label>
        <input type="email" placeholder="correo@ejemplo.com">

        <label>Número de Tarjeta</label>
        <input type="text" placeholder="16 dígitos de tu tarjeta">

        <label>Nombre Completo</label>
        <input type="text" placeholder="Nombre en la tarjeta">

        <label>Fecha de Nacimiento</label>
        <input type="date">

        <button type="button" class="btn-submit">Vincular Tarjeta</button>
      </form>
    </div>

    <!-- Enlace de regreso a la página principal -->
    <a href="index.html" class="btn-volver">← Volver a Inicio</a>
  </div>

</body>
</html>
